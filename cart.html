<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - LensCraft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #111;
            padding: 15px 25px;
        }

        .navbar-brand {
            color: #d4af37 !important;
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav-link {
            color: #ddd !important;
            margin-left: 15px;
        }

        .nav-link:hover {
            color: #d4af37 !important;
        }

        .cart-header {
            margin-top: 45px;
            background: #222;
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .cart-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .gold-btn {
            background: #d4af37;
            border: none;
            font-weight: bold;
        }

        footer {
            background: #111;
            color: white;
            padding: 40px 0;
            margin-top: 50px;
        }

        @media (max-width: 800px) {

            .nav-link {
                margin-left: 0;
            }

        }

    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand"
           href="index.html">
            LENSCRAFT
        </a>


        <button class="navbar-toggler bg-light"
                type="button"
                onclick="toggleMenu()">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="navLinks">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cameras.html">Cameras</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="lenses.html">Lenses</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="accessories.html">Accessories</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="explore.html">Explore</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">
                        <i class="bi bi-cart3"></i>
                        Cart
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="cart-header">

    <h1>
        Shopping Cart
    </h1>

    <p>
        Review your selected photography gear.
    </p>

</section>


<section class="py-5">

    <div class="container">

        <div class="cart-box">

            <h3>
                <i class="bi bi-cart3"></i>
                Your Selected Item
            </h3>

            <hr>

            <div id="cartContent">

            </div>

        </div>

    </div>

</section>


<footer class="text-center">

    <h4>
        LensCraft Camera Store
    </h4>

    <p>
        Thank you for shopping with us.
    </p>

</footer>


<script>

    console.log("Cart Page Loaded");


    function toggleMenu() {

        document
            .getElementById("navLinks")
            .classList.toggle("show");

    }


    let params =
        new URLSearchParams(
            window.location.search
        );


    let product =
        params.get("product");

    let price =
        params.get("price");


    if (product && price) {

        document.getElementById("cartContent").innerHTML =

            "<h4>" + product + "</h4>" +

            "<p class='text-muted'>" +
            "Selected product" +
            "</p>" +

            "<h5>₹" + price + "</h5>" +

            "<button class='btn gold-btn mt-3' " +
            "onclick='placeOrder()'>" +

            "PROCEED TO ORDER" +

            "</button>";

        console.log(
            "Cart Product: " + product
        );

    }

    else {

        document.getElementById("cartContent").innerHTML =

            "<p class='text-muted'>" +
            "Your cart is currently empty." +
            "</p>";

    }


    function placeOrder() {

        window.alert(
            "Your order has been started!"
        );

        console.log(
            "Proceed to order clicked"
        );

        window.location.href =
            "order.html";

    }

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
