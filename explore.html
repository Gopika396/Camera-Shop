<!DOCTYPE html>

    <style>

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #111;
            padding: 15px 25px;
        }

        .navbar-brand {
            color: #d4af37 !important;
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav-link {
            color: #ddd !important;
            margin-left: 15px;
        }

        .nav-link:hover {
            color: #d4af37 !important;
        }

        .page-header {
            margin-top: 45px;
            background: #222;
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .gallery-card {
            overflow: hidden;
            border: none;
        }

        .gallery-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: 0.5s;
        }

        .gallery-card:hover img {
            transform: scale(1.08);

        footer {
            background: #111;
            color: white;
